<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 600px; height: 600px; overflow: hidden; background: #b45309; }
        svg { width: 600px; height: 600px; display: block; }
    </style>
</head>

<body>
    <svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#9A3412" />
                <stop offset="55%" stop-color="#C2410C" />
                <stop offset="100%" stop-color="#EA580C" />
            </linearGradient>
            <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </radialGradient>
        </defs>

        <rect width="1200" height="1200" fill="url(#bg)" />
        <circle cx="948" cy="180" r="560" fill="url(#glow)" />

        <!-- order table card -->
        <rect x="285" y="270" width="630" height="600" rx="46" fill="#FFFFFF" />

        <!-- header row: product + qty column hints -->
        <rect x="350" y="350" width="250" height="34" rx="17" fill="#FED7AA" />
        <rect x="760" y="346" width="100" height="42" rx="12" fill="#FFEDD5" />
        <rect x="350" y="428" width="500" height="3" rx="1.5" fill="#FDBA74" />

        <!-- 3 variant rows: label bar + quantity stepper -->
        <!-- row 1 -->
        <rect x="350" y="486" width="300" height="30" rx="15" fill="#F7F7F7" />
        <g>
            <rect x="738" y="470" width="112" height="62" rx="14" fill="none" stroke="#FDBA74" stroke-width="5" />
            <rect x="758" y="498" width="26" height="6" rx="3" fill="#FDBA74" />
            <rect x="791" y="485" width="6" height="32" rx="3" fill="#FB923C" />
            <rect x="778" y="498" width="32" height="6" rx="3" fill="#FB923C" />
        </g>
        <rect x="350" y="566" width="500" height="2.5" rx="1.25" fill="#F1E8E1" />

        <!-- row 2 -->
        <rect x="350" y="612" width="232" height="30" rx="15" fill="#F7F7F7" />
        <g>
            <rect x="738" y="596" width="112" height="62" rx="14" fill="none" stroke="#FDBA74" stroke-width="5" />
            <rect x="758" y="624" width="26" height="6" rx="3" fill="#FDBA74" />
            <rect x="791" y="611" width="6" height="32" rx="3" fill="#FB923C" />
            <rect x="778" y="624" width="32" height="6" rx="3" fill="#FB923C" />
        </g>
        <rect x="350" y="692" width="500" height="2.5" rx="1.25" fill="#F1E8E1" />

        <!-- row 3: active quantity -->
        <rect x="350" y="738" width="270" height="30" rx="15" fill="#F7F7F7" />
        <g>
            <rect x="738" y="722" width="112" height="62" rx="14" fill="#EA580C" />
            <rect x="758" y="750" width="26" height="6" rx="3" fill="#FFFFFF" />
            <rect x="791" y="737" width="6" height="32" rx="3" fill="#FFFFFF" />
            <rect x="778" y="750" width="32" height="6" rx="3" fill="#FFFFFF" />
        </g>

        <!-- add-all pill -->
        <rect x="350" y="920" width="500" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.16" />
        <rect x="430" y="946" width="340" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92" />
    </svg>
</body>

</html>
