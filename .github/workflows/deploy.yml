name: Deploy

# CD 已启用（2026-10-06，用户拍板）：合并到 main 即自动部署。
# 前置已就绪：DNS A 记录 + 服务器初始化（/srv/tablely）+ secrets SSH_HOST / SSH_USER / SSH_KEY
# （2026-10-06 写入，复用共享部署密钥；服务器 env 只存服务器，不进仓库）。
# 具体步骤收敛在 scripts/deploy.sh（含健康门禁 + 失败自动回滚）；如需手工重跑用 workflow_dispatch。
# ⚠️ 本 workflow 只部署、不跑校验：门禁在 push / PR 的 ci.yml（verify + function）里，
#    因此**不要**开启「绕过分支保护直推 main」——那会绕过校验直接上线。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck # 类型门禁

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 具体步骤收敛在 scripts/deploy.sh（含健康门禁与失败自动回滚），
          # 演练与线上跑的是同一份脚本，避免两边漂移。
          script: |
            set -e
            cd /srv/tablely
            bash scripts/deploy.sh