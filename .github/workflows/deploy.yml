name: Deploy

# ⚠️ CD 的**脚本**已就绪（scripts/deploy.sh + scripts/rollback.sh），但**启用自动部署**
# 属于线上基建动作，需单独拍板：打开下面的 push 触发 + 在仓库 secrets 里配好
# SSH_HOST / SSH_USER / SSH_KEY（服务器 env 只存服务器，不进仓库）。
# 在那之前保留 workflow_dispatch 手动触发，避免每次 push main 都去连生产服务器。
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck # 类型门禁

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 具体步骤收敛在 scripts/deploy.sh（含健康门禁与失败自动回滚），
          # 演练与线上跑的是同一份脚本，避免两边漂移。
          script: |
            set -e
            cd /srv/tablely
            bash scripts/deploy.sh