name: CI

# Y6（§21.4）：PR 必须 CI 全绿才可合并（配合 GitHub 分支保护：禁止直推 main）。
#   verify   —— 所有 PR + push main：typecheck / lint / check-i18n / vitest / build + 安全断言
#   function —— 仅当 extensions/tablely-pricing/** 变更时才有实质动作（M12 起接入三种 mode 的 fixture）
#   e2e      —— 只跑里程碑标记（v* tag）/ 夜间 / 手动；Playwright 在 M5 引入
#
# ⚠️ 与 deploy.yml 的分工：本文件只做「门禁」，不负责部署。
#    部署（SSH + 共享 edge 层，§九）在 deploy.yml，按 §十一 M15 才接入自动触发。

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # 夜间跑一次（UTC 18:00 ≈ 北京时间 02:00），用于 e2e
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # 与本地/生产容器一致并锁定
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check-i18n # 后台 + 店面（主题扩展 locales）7 语言零缺项
      - run: npm run test # vitest（§21.1 单元层）
      - run: npm run build
      - run: npm run check-bundle # §2.3.1 P2：店面 JS gzip ≤ 15 KB

      # §8.2 D：SHOPIFY_API_SECRET 仅服务端使用，绝不进前端 bundle。
      # 只断言客户端产物——服务端 bundle 里出现该变量名属正常。
      - name: 断言客户端产物不含应用密钥
        run: |
          set -e
          fail=0
          if grep -rIl "shpss_" build/client 2>/dev/null; then
            echo "::error::客户端产物中出现了应用密钥（shpss_…）"
            fail=1
          fi
          if grep -rIl "SHOPIFY_API_SECRET" build/client 2>/dev/null; then
            echo "::error::客户端产物引用了 SHOPIFY_API_SECRET（服务端专用）"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "客户端产物未发现密钥"

      # §8.2 E：高危/严重漏洞阻断合并（低危仅记录）。
      # 只审计**生产依赖树**（--omit=dev）：devDependencies 里的 lint/codegen 工具链
      # 不随镜像发布，其告警记入 issue 但不阻断（否则每次上游工具链告警都会卡住合并）。
      #
      # 放行项（有根因说明，附定期复核）：
      #   - effect ≤3.22.0 ReDoS (GHSA-7589-6fvf-x4pw)：@prisma/config（prisma 6.19.x 内部包）
      #     带 effect@3.20~3.21，npm audit 的 range ">=6.13.0-dev.1" 是 semver 预发布
      #     比较 bug，误伤了稳定版。实际 effect@3.21.0 不在漏洞范围（fix 在 3.22.1），
      #     且 @prisma/config 仅处理本地 prisma 配置文件（非网络输入，ReDoS 不可达）。
      #     复核点：prisma 7.x 发布后移除 effect 依赖，或 effect 3.20~3.21 被正式 CVE 覆盖时。
      - run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          # 过滤已知放行项，保留其余 high/critical 漏洞阻断
          # 用 Node 而不是 python3（ubuntu-latest 未必带），CI 里 Node 20 必然可用
          # 注意：npm audit 有漏洞时 exit 1，上面 || true 先吞掉让 JSON 文件落盘
          node - <<'JS'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const SKIP = new Set(['effect', '@prisma/config', 'prisma', '@shopify/shopify-app-session-storage-prisma']);
          const bad = [];
          for (const [name, info] of Object.entries(d.vulnerabilities || {})) {
            if (!['high', 'critical'].includes(info.severity)) continue;
            if (SKIP.has(name)) {
              const viaNames = new Set(
                (info.via || []).filter(v => typeof v === 'object').map(v => v.name)
              );
              if ([...viaNames].every(n => SKIP.has(n))) {
                console.log(`[放行] ${name}: ${info.severity} — ${info.range || '?'} (已知误报，见 ci.yml §8.2 E 注释)`);
                continue;
              }
            }
            bad.push({name, severity: info.severity, range: info.range || '?'});
          }
          if (bad.length) {
            console.log('发现未放行的高危漏洞：');
            for (const b of bad) console.log(`  ${b.name}: ${b.severity} (${b.range})`);
            process.exit(1);
          }
          console.log('audit 通过（放行 effect 已知误报）');
          JS

  function:
    name: function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pricing:
              - 'extensions/tablely-pricing/**'

      # 本 job 只用 CLI 工具链（构建 function wasm + 跑 fixture），**不跑应用运行时**，
      # 故 Node 版本无需与生产容器（node:20-alpine）一致：Shopify CLI 4.8.0 依赖
      # `node:module` 的 `enableCompileCache`（Node ≥ 22.1），用 20 会直接 SyntaxError。
      # 应用的 typecheck / build / 单测仍由 verify job 在 **Node 20** 上把关（与生产一致）。
      - if: steps.filter.outputs.pricing == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 改价是审核敏感点：每次改 Function 都必须重跑（§21.2）。
      # M12 起把 tier / wholesale / mixmatch 三种 mode 的 fixture 补进**扩展自带**的 vitest 项目，
      # 由 `test:function` 触发（跑 fixtures + 纯逻辑单测，并构建 wasm 验证 input query 与 schema 可编译）。
      # 注意：`npm run test` 只覆盖 `app/**`，不含扩展，故这里必须用 `test:function`。
      - if: steps.filter.outputs.pricing == 'true'
        run: npm ci

      # Function 测试助手（@shopify/shopify-function-test-helpers）会直接 spawn **裸 `shopify`**
      # 命令去构建 wasm，因此 runner 上必须存在 CLI —— 本地开发者机器同理由全局 CLI 提供。
      # 用与本地已验证一致的版本（§21.4 记录的 4.8.0）；`@shopify/cli` 不进 package.json，
      # 应用运行时与镜像均不需要它（与 §21.4「CLI 属开发工具、不随镜像发布」一致）。
      - if: steps.filter.outputs.pricing == 'true'
        run: npm install -g @shopify/cli@4.8.0

      - if: steps.filter.outputs.pricing == 'true'
        run: npm run test:function

      - if: steps.filter.outputs.pricing == 'true'
        run: shopify app function build --path extensions/tablely-pricing

      - if: steps.filter.outputs.pricing != 'true'
        run: echo "未改动 extensions/tablely-pricing/**，跳过 function job"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # 不在每次 PR 跑：Playwright 需真实（非无头）浏览器 + dev 店，成本高（§21.4）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: 运行 Playwright e2e
        run: |
          if [ -f playwright.config.ts ]; then
            npx playwright install --with-deps chromium
            npx playwright test
          else
            echo "playwright.config.ts 尚未就绪（M5 引入），本次跳过 e2e"
          fi